<!DOCTYPE html>
<html>
<head>
    <title>Mesonero POS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow">
        <h2 class="text-xl font-bold mb-4 text-center">Pedido nuevo</h2>
        
        <label class="block font-semibold mb-1">Número de mesa:</label>
        <input type="number" id="tableNum" value="1" class="w-full border p-2 rounded mb-4 text-lg">

        <h3 class="font-semibold mb-2">Carta / Categorías</h3>
        
        <!-- Category Navigation Tabs -->
        <div class="flex flex-wrap gap-2 mb-4">
            <button onclick="loadProducts('All')" class="category-btn bg-gray-200 hover:bg-gray-300 text-gray-800 px-3 py-1.5 rounded text-sm font-semibold">Todo</button>
            <button onclick="loadProducts('Mains')" class="category-btn bg-blue-100 hover:bg-blue-200 text-blue-800 px-3 py-1.5 rounded text-sm font-semibold">Platos</button>
            <button onclick="loadProducts('Drinks')" class="category-btn bg-green-100 hover:bg-green-200 text-green-800 px-3 py-1.5 rounded text-sm font-semibold">Bebidas</button>
            <button onclick="loadProducts('Sides')" class="category-btn bg-yellow-100 hover:bg-yellow-200 text-yellow-800 px-3 py-1.5 rounded text-sm font-semibold">Entradas</button>
            <button onclick="loadProducts('Dessert')" class="category-btn bg-purple-100 hover:bg-purple-200 text-purple-800 px-3 py-1.5 rounded text-sm font-semibold">Postres</button>
        </div>

        <!-- Dynamic Product Grid/List -->
        <div id="product-grid" class="space-y-2 mb-6 max-h-64 overflow-y-auto pr-1">
            <!-- Products load here dynamically via JavaScript -->
        </div>

        <h3 class="font-semibold mb-2">Orden:</h3>
        <div id="cart" class="border p-3 rounded mb-4 min-h-[80px] bg-gray-50 text-sm"></div>

        <button onclick="sendOrder()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded">
            Enviar a la cocina
        </button>
    </div>

    <script>
        let cart = [];

        // Fetch and render products based on selected category
        function loadProducts(category) {
            let url = '/api/products';
            if (category !== 'All') {
                url += `?category=${category}`;
            }

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    let container = document.getElementById('product-grid');
                    container.innerHTML = '';
                    
                    if (data.length === 0) {
                        container.innerHTML = '<p class="text-gray-400 text-center py-4">No items in this category</p>';
                        return;
                    }

                    data.forEach(item => {
                        container.innerHTML += `
                            <button onclick="addToCart(${item.id}, '${item.name}', ${item.price})" 
                                    class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2.5 px-4 rounded text-left font-semibold flex justify-between items-center shadow-sm">
                                <span>${item.name}</span>
                                <span class="bg-blue-700 px-2 py-0.5 rounded text-xs">$${item.price.toFixed(2)}</span>
                            </button>
                        `;
                    });
                })
                .catch(error => console.error('Error loading products:', error));
        }

        function addToCart(id, name, price) {
            cart.push({id, name, price});
            renderCart();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart');
            if (cart.length === 0) {
                container.innerHTML = '<span class="text-gray-400">Cart is empty</span>';
                return;
            }

            container.innerHTML = cart.map((i, index) => `
                <div class="flex justify-between items-center py-2 border-b border-gray-200">
                    <span>${i.name} (<span class="text-gray-600">$${i.price.toFixed(2)}</span>)</span>
                    <button onclick="removeFromCart(${index})" class="bg-red-100 hover:bg-red-200 text-red-600 px-2 py-1 rounded text-xs font-semibold">
                        Quitar
                    </button>
                </div>
            `).join('');
        }

        async function sendOrder() {
            const table = document.getElementById('tableNum').value;
            if (!table || cart.length === 0) return alert('Select table and add items');

            const response = await fetch('/submit_order', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ table_number: parseInt(table), items: cart })
            });

            if (response.ok) {
                alert('Orden enviada!');
                cart = [];
                renderCart();
            } else {
                alert('Error enviando orden.');
            }
        }

        // Load all items by default when the page first opens
        loadProducts('All');
    </script>
</body>
</html>
