<!DOCTYPE html>
<html>
<head>
    <title>Mesonero POS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow">
        <h2 class="text-xl font-bold mb-4 text-center">Pedido nuevo</h2>

        <label class="block font-semibold mb-1">Número de mesa:</label>
        <input type="number" id="tableNum" value="1" class="w-full border p-2 rounded mb-4 text-lg">

        <h3 class="font-semibold mb-2">Carta / Categorías</h3>

        <!-- Category Navigation Tabs -->
        <div class="flex flex-wrap gap-2 mb-4">
            <button onclick="loadProducts('All')" class="category-btn bg-gray-200 hover:bg-gray-300 text-gray-800 px-3 py-1.5 rounded text-sm font-semibold">Todo</button>
            <button onclick="loadProducts('Mains')" class="category-btn bg-blue-100 hover:bg-blue-200 text-blue-800 px-3 py-1.5 rounded text-sm font-semibold">Platos</button>
            <button onclick="loadProducts('Drinks')" class="category-btn bg-green-100 hover:bg-green-200 text-green-800 px-3 py-1.5 rounded text-sm font-semibold">Bebidas</button>
            <button onclick="loadProducts('Sides')" class="category-btn bg-yellow-100 hover:bg-yellow-200 text-yellow-800 px-3 py-1.5 rounded text-sm font-semibold">Entradas</button>
            <button onclick="loadProducts('Dessert')" class="category-btn bg-purple-100 hover:bg-purple-200 text-purple-800 px-3 py-1.5 rounded text-sm font-semibold">Postres</button>
        </div>

        <!-- Dynamic Product Grid/List -->
        <div id="product-grid" class="space-y-2 mb-6 max-h-64 overflow-y-auto pr-1">
            <!-- Products load here dynamically via JavaScript -->
        </div>

        <h3 class="font-semibold mb-2">Orden:</h3>
        <div id="cart" class="border p-3 rounded mb-4 min-h-[80px] bg-gray-50 text-sm">
            <span class="text-gray-400">Cart is empty</span>
        </div>

        <button onclick="sendOrder()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded">
            Enviar a la cocina
        </button>
    </div>

    <!-- Side Dish Modal for Mains (Up to 2 sides) -->
    <div id="sideModal" class="hidden fixed inset-0 bg-black/60 z-50 items-center justify-center p-4">
        <div class="bg-white p-5 rounded-lg max-w-sm w-full text-center shadow-lg">
            <h3 id="sideModalTitle" class="text-lg font-bold mb-1">Elige hasta 2 contornos</h3>
            <p id="sideCounterText" class="text-xs text-gray-500 mb-4">Seleccionados: 0 / 2</p>

            <div id="sideButtonsGrid" class="grid grid-cols-2 gap-2.5 mb-4">
                {% for side in side_options %}
                    <button type="button" data-side="{{ side }}" onclick="toggleSideOption(this, '{{ side }}')"
                            class="side-option-btn bg-gray-100 hover:bg-gray-200 text-gray-800 border-2 border-transparent font-semibold py-3 px-2 rounded text-sm transition">
                        {{ side }}
                    </button>
                {% endfor %}
            </div>

            <div class="flex gap-2">
                <button type="button" onclick="closeSideModal()"
                        class="w-1/2 bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded text-sm">
                    Cancelar
                </button>
                <button type="button" id="confirmSidesBtn" onclick="confirmMainWithSides()"
                        class="w-1/2 bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded text-sm">
                    Confirmar (0/2)
                </button>
            </div>
        </div>
    </div>

    <script>
        let cart = [];
        let pendingMainItem = null;
        let selectedSides = [];
        const MAX_SIDES = 2;

        // Fetch and render products based on selected category
        function loadProducts(category) {
            let url = '/api/products';
            if (category !== 'All') {
                url += `?category=${category}`;
            }

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    let container = document.getElementById('product-grid');
                    container.innerHTML = '';
                    
                    if (data.length === 0) {
                        container.innerHTML = '<p class="text-gray-400 text-center py-4">No items in this category</p>';
                        return;
                    }

                    data.forEach(item => {
                        const safeName = item.name.replace(/'/g, "\\'");
                        container.innerHTML += `
                            <button onclick="handleMenuClick(${item.id}, '${safeName}', '${item.category}', ${item.price})" 
                                    class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2.5 px-4 rounded text-left font-semibold flex justify-between items-center shadow-sm">
                                <span>${item.name}</span>
                                <span class="bg-blue-700 px-2 py-0.5 rounded text-xs">$${item.price.toFixed(2)}</span>
                            </button>
                        `;
                    });
                })
                .catch(error => console.error('Error loading products:', error));
        }

        function handleMenuClick(id, name, category, price) {
            if (category === 'Mains') {
                pendingMainItem = { id, name, price };
                selectedSides = [];
                updateSideModalUI();

                document.getElementById('sideModalTitle').innerText = `Contornos para ${name}`;
                const modal = document.getElementById('sideModal');
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            } else {
                addToCart(id, name, price, '');
            }
        }

        function toggleSideOption(btn, side) {
            // If "Sin contorno" is chosen, clear others and select only it
            if (side === 'Sin contorno') {
                selectedSides = selectedSides.includes(side) ? [] : [side];
                updateSideModalUI();
                return;
            }

            // Remove "Sin contorno" if picking an actual side
            selectedSides = selectedSides.filter(s => s !== 'Sin contorno');

            const idx = selectedSides.indexOf(side);
            if (idx > -1) {
                selectedSides.splice(idx, 1);
            } else {
                if (selectedSides.length >= MAX_SIDES) {
                    // Replace the first selected side if user picks a 3rd
                    selectedSides.shift();
                }
                selectedSides.push(side);
            }
            updateSideModalUI();
        }

        function updateSideModalUI() {
            document.querySelectorAll('.side-option-btn').forEach(btn => {
                const side = btn.getAttribute('data-side');
                if (selectedSides.includes(side)) {
                    btn.classList.remove('bg-gray-100', 'text-gray-800', 'border-transparent');
                    btn.classList.add('bg-blue-600', 'text-white', 'border-blue-800');
                } else {
                    btn.classList.add('bg-gray-100', 'text-gray-800', 'border-transparent');
                    btn.classList.remove('bg-blue-600', 'text-white', 'border-blue-800');
                }
            });

            const count = selectedSides.length;
            document.getElementById('sideCounterText').innerText = `Seleccionados: ${count} / ${MAX_SIDES}`;
            document.getElementById('confirmSidesBtn').innerText = `Confirmar (${count}/${MAX_SIDES})`;
        }

        function confirmMainWithSides() {
            if (!pendingMainItem) return;
            const notes = selectedSides.length > 0 ? `Contornos: ${selectedSides.join(', ')}` : '';
            addToCart(
                pendingMainItem.id,
                pendingMainItem.name,
                pendingMainItem.price,
                notes
            );
            closeSideModal();
        }

        function closeSideModal() {
            pendingMainItem = null;
            selectedSides = [];
            const modal = document.getElementById('sideModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function addToCart(id, name, price, notes = '') {
            cart.push({ id, name, price, notes });
            renderCart();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart');
            if (cart.length === 0) {
                container.innerHTML = '<span class="text-gray-400">Cart is empty</span>';
                return;
            }

            container.innerHTML = cart.map((i, index) => `
                <div class="flex justify-between items-center py-2 border-b border-gray-200">
                    <div>
                        <div>${i.name} (<span class="text-gray-600">$${i.price.toFixed(2)}</span>)</div>
                        ${i.notes ? `<div class="text-xs text-blue-700 font-medium">+ ${i.notes}</div>` : ''}
                    </div>
                    <button onclick="removeFromCart(${index})" class="bg-red-100 hover:bg-red-200 text-red-600 px-2 py-1 rounded text-xs font-semibold">
                        Quitar
                    </button>
                </div>
            `).join('');
        }

        async function sendOrder() {
            const table = document.getElementById('tableNum').value;
            if (!table || cart.length === 0) return alert('Select table and add items');

            const response = await fetch('/submit_order', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ table_number: parseInt(table), items: cart })
            });

            if (response.ok) {
                alert('Orden enviada!');
                cart = [];
                renderCart();
            } else {
                alert('Error enviando orden.');
            }
        }

        // Load all items by default when the page first opens
        loadProducts('All');
    </script>
</body>
</html>
